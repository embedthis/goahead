name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            install-deps: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies
        shell: bash
        run: ${{ matrix.install-deps }}

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH
        if: runner.os != 'Windows'

      - name: Add Bun to PATH (Windows)
        run: echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: runner.os == 'Windows'

      #
      #   Installs the @embedthis/testme and @embedthis/ejscript devDependencies from the lockfile.
      #   The TestMe post-install script builds the "tm" command into ~/.bun/bin, which is on the
      #   PATH from the steps above.
      #
      - name: Install test dependencies
        shell: bash
        run: npm ci

      - name: Verify TestMe installation (Unix)
        if: runner.os != 'Windows'
        run: |
          tm --version

      - name: Verify TestMe installation (Windows)
        if: runner.os == 'Windows'
        run: |
          tm.exe --version
          # Get-ChildItem -Recurse -Path "C:\Program Files\OpenSSL"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          make SHOW=1

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call projects\openssl-prep.bat
          msbuild projects\vs2022\goahead.sln /p:Configuration=debug /p:Platform=windows /v:normal

      #
      #   dist/ is generated from src/ but committed for pak consumers. Fail loudly if a
      #   source change (in particular a security fix) has not been amalgamated.
      #
      - name: Verify dist/ is in sync with src/
        if: matrix.os == 'ubuntu-latest'
        run: |
          make check-dist

      - name: Run test suite (Unix)
        if: runner.os != 'Windows'
        run: |
          make test

      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call projects\openssl-prep.bat
          tm test

  #
  #   SDL/CRA release-gate evidence. These run on every push so the release-time evidence is a
  #   CI artifact rather than a hand-run pass, per the SDL Verification Phase requirement that
  #   dependency scans and static analysis be "current and clean".
  #
  security:
    name: Security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev clang-tools

      #
      #   Build and test tooling only - no third-party package ships in the product, so this is
      #   build-integrity evidence rather than a CRA gate. Advisories here do not block a release;
      #   see doc/releases/*/vulnerability-disposition.md Scope A.
      #
      - name: Dependency audit (build/test tree)
        run: npm audit --audit-level=high

      #
      #   Static analysis over the full product build. Findings are triaged into
      #   doc/releases/*/vulnerability-disposition.md Scope C. The step reports rather than fails:
      #   the analyzer flags the assert-based API contract and dead stores that are dispositioned
      #   as not-applicable, so a raw count is not a pass/fail signal. The report is uploaded for
      #   the release evidence package.
      #
      - name: Static analysis (scan-build)
        run: |
          scan-build -o build/scan-results --status-bugs make || true
          scan-build -o /dev/null make 2>&1 | tail -1

      - name: Upload static-analysis report
        uses: actions/upload-artifact@v4
        with:
          name: scan-build-report
          path: build/scan-results
          if-no-files-found: ignore
          retention-days: 90
