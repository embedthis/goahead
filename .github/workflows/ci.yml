name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# Pin actions by commit SHA. Dependabot proposes updates; ci-pinning.tst.ts rejects unpinned references.
permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            install-deps: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install system dependencies
        shell: bash
        run: ${{ matrix.install-deps }}

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH
        if: runner.os != 'Windows'

      - name: Add Bun to PATH (Windows)
        run: echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: runner.os == 'Windows'

      #
      #   Installs the @embedthis/testme and @embedthis/ejscript devDependencies from the lockfile.
      #   The TestMe post-install script builds the "tm" command into ~/.bun/bin, which is on the
      #   PATH from the steps above.
      #
      - name: Install test dependencies
        shell: bash
        run: npm ci

      - name: Verify TestMe installation (Unix)
        if: runner.os != 'Windows'
        run: |
          tm --version

      - name: Verify TestMe installation (Windows)
        if: runner.os == 'Windows'
        run: |
          tm.exe --version
          # Get-ChildItem -Recurse -Path "C:\Program Files\OpenSSL"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          make SHOW=1

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call projects\openssl-prep.bat
          msbuild projects\vs2022\goahead.sln /p:Configuration=debug /p:Platform=windows /v:normal

      #
      #   The release configuration is what an integrator ships, but every other step here builds
      #   debug. Optimisation enables diagnostics the debug build cannot produce, so a release-only
      #   warning or error would otherwise reach customers unseen. Build it, and treat any warning
      #   as a failure so the configuration stays clean.
      #
      - name: Build release (Unix)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          make clean
          make OPTIMIZE=release SHOW=1 2>&1 | tee /tmp/release-build.log
          #
          #   Match "warning:" rather than "warning": SHOW=1 echoes the compiler command lines,
          #   which carry flags such as -Wno-unknown-warning-option that a looser pattern hits.
          #
          if grep -qE 'warning:|is obsolete' /tmp/release-build.log ; then
            echo "::error::Release build produced warnings"
            grep -E 'warning:|is obsolete' /tmp/release-build.log
            exit 1
          fi
          make clean

      #
      #   Cross-file inlining in the amalgamation exposes null dereferences that a per-file build cannot
      #   see, so compile the committed amalgamation once with the release flags.
      #
      - name: Compile amalgamation (Linux)
        if: runner.os == 'Linux'
        run: |
          gcc -O2 -std=gnu11 -D_FORTIFY_SOURCE=3 -DME_COM_OPENSSL=1 -DME_COM_MBEDTLS=0 -DME_COM_SSL=1 -Werror=null-dereference -Isrc/osdep -c dist/goaheadLib.c -o /dev/null

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call projects\openssl-prep.bat
          msbuild projects\vs2022\goahead.sln /p:Configuration=release /p:Platform=windows /v:normal
          rem  Both configurations build into build\bin. Rebuild debug, as the Unix step cleans, so the tests
          rem  run against the debug C runtime they are compiled for.
          msbuild projects\vs2022\goahead.sln /t:Rebuild /p:Configuration=debug /p:Platform=windows /v:minimal

# Fail if default-enabled features are disabled and their tests would skip.
      - name: Run test suite (Unix)
        if: runner.os != 'Windows'
        env:
          TM_STRICT_SKIPS: '1'
        run: |
          make test

      # Print the full server log on failure, including crashes and sanitizer reports after the last test.
      - name: Print server log (Unix)
        if: failure() && runner.os != 'Windows'
        run: cat server-log.txt || true

      # Print staging diagnostics alongside test output, preserving tm's exit status.
      # windows.bat supplies the Visual Studio environment for tests that compile C.
      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          TM_STRICT_SKIPS: '1'
        run: |
          call projects\windows.bat tm test
          set TMRC=%ERRORLEVEL%
          echo.
          echo ---- prep-diag.txt (CGI staging, captured before cleanup) ----
          if exist prep-diag.txt (type prep-diag.txt) else (echo "(absent - prep.sh did not run)")
          echo ---- end prep-diag.txt ----
          echo.
          rem  Only cgiHandler's own failure messages. A broader filter is useless: the suite drives
          rem  error paths deliberately, so a passing run already logs 82,000 level-0 lines. None of
          rem  these appear on a passing run, so whichever shows up names the exact failure point.
          echo ---- server-log.txt: CGI failures ----
          if exist server-log.txt (findstr /c:"Cannot find CGI program" /c:"CGI program file does not exist" /c:"CGI process file is not executable" /c:"failed to spawn CGI task" /c:"CGI generated no output" /c:"Cannot open CGI stdin" /c:"Cannot open CGI stdout" /c:"Cannot create CGI stdout" /c:"Cannot write to CGI gateway" /c:"Missing CGI name" server-log.txt) else (echo "(absent)")
          echo ---- end server-log.txt ----
          exit /b %TMRC%

      #
      #   Windows CGI staging diagnostics. testme reports only "Prep script completed successfully",
      #   so a staging failure surfaces as a wall of unrelated CGI test failures with no indication
      #   of the cause. Runs on failure as well as success, and must never fail the job itself.
      #
      #   The standalone cgitest run is the decisive one: if it cannot start, the CGI child cannot
      #   either, and the reason (missing DLL, wrong architecture, ...) is printed here rather than
      #   inferred from which assertions happened to pass.
      #
      - name: CGI staging diagnostics (Windows)
        if: always() && runner.os == 'Windows'
        shell: cmd
        continue-on-error: true
        run: |
          rem  prep-diag.txt is written by prep.sh at the repository root. It records the state of
          rem  cgi-bin at staging time, which is the only moment that matters: cleanup.sh empties
          rem  cgi-bin and deletes *.log before this step runs.
          echo ---- prep-diag.txt ----
          if exist prep-diag.txt (type prep-diag.txt) else (echo "(prep-diag.txt absent - prep.sh did not run)")
          echo ---- build\bin ----
          dir build\bin
          echo ---- test\cgi-bin (post-cleanup, expected empty) ----
          dir test\cgi-bin
          echo ---- cgitest.exe standalone ----
          rem  Run the build/bin copy: the cgi-bin copy has been removed by cleanup.sh. This shows
          rem  whether the binary can start at all - a DLL resolution failure reports here.
          rem  cgitest only reads stdin when CONTENT_LENGTH is set, but redirect anyway so this
          rem  step can never block the job waiting on a console.
          build\bin\cgitest.exe < NUL
          echo cgitest exit=%ERRORLEVEL%
          echo ---- goahead-test.exe standalone ----
          build\bin\goahead-test.exe --version < NUL
          echo goahead-test exit=%ERRORLEVEL%

# Run the suite with AddressSanitizer and UndefinedBehaviorSanitizer.
  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install test dependencies
        run: npm ci

      - name: Run test suite (sanitized)
        env:
          TM_STRICT_SKIPS: '1'
        run: |
          make test-asan

      #
      #   clang adds the integer and implicit-conversion groups, which gcc does not have.
      #
      - name: Run test suite (sanitized, clang)
        env:
          TM_STRICT_SKIPS: '1'
        run: |
          sudo apt-get install -y clang
          make test-asan CC=clang

      - name: Print server log
        if: failure()
        run: cat server-log.txt || true

  # Compile and link each feature configuration without warnings. Only the allocator variant runs the suite:
  # other variants cannot use its default-feature routes and C tests.
  # Override DEFINES for TLS variants because generated defines follow CFLAGS.
  features:
    name: Features (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: logging-off
            cflags: -DME_GOAHEAD_LOGGING=0
            run: true
          - leg: tracing-off
            cflags: -DME_GOAHEAD_TRACING=0
          - leg: legacy
            cflags: -DME_GOAHEAD_LEGACY=1
          - leg: rom
            cflags: -DME_ROM=1
          - leg: auth-off
            cflags: -DME_GOAHEAD_AUTH=0
            run: true
          - leg: digest-off
            cflags: -DME_GOAHEAD_DIGEST=0
          - leg: access-log
            cflags: -DME_GOAHEAD_ACCESS_LOG=1
          - leg: no-tls
            defines: -DME_COM_SSL=0 -DME_COM_OPENSSL=0 -DME_COM_MBEDTLS=0 -DME_DEBUG=1
          - leg: replace-malloc
            cflags: -DME_GOAHEAD_REPLACE_MALLOC=1
            run: true
          - leg: assert-abort
            cflags: -DME_GOAHEAD_ASSERT_ABORT=1
          - leg: release-legacy
            optimize: release
            cflags: -DME_GOAHEAD_LEGACY=1
          - leg: cgi-off
            cflags: -DME_GOAHEAD_CGI=0
            run: true
          - leg: javascript-off
            cflags: -DME_GOAHEAD_JAVASCRIPT=0
            run: true
          - leg: upload-off
            cflags: -DME_GOAHEAD_UPLOAD=0
            run: true

    env:
      LEG_CFLAGS: ${{ matrix.cflags }}
      LEG_DEFINES: ${{ matrix.defines }}
      LEG_OPTIMIZE: ${{ matrix.optimize || 'debug' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        if: matrix.run
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev

      - name: Add Bun to PATH
        if: matrix.run
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install test dependencies
        if: matrix.run
        run: npm ci

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          args=(OPTIMIZE="$LEG_OPTIMIZE" SHOW=1)
          [ -n "$LEG_CFLAGS" ] && args+=(CFLAGS="$LEG_CFLAGS")
          [ -n "$LEG_DEFINES" ] && args+=(DEFINES="$LEG_DEFINES")
          make clean
          make "${args[@]}" 2>&1 | tee /tmp/feature-build.log
          if grep -qE 'warning:|is obsolete' /tmp/feature-build.log ; then
            echo "::error::The ${{ matrix.leg }} build produced warnings"
            grep -E 'warning:|is obsolete' /tmp/feature-build.log
            exit 1
          fi

      - name: Run test suite
        if: matrix.run
        shell: bash
        run: |
          args=(OPTIMIZE="$LEG_OPTIMIZE")
          [ -n "$LEG_CFLAGS" ] && args+=(CFLAGS="$LEG_CFLAGS")
          make "${args[@]}" test

      - name: Print server log
        if: failure() && matrix.run
        run: cat server-log.txt || true

  security:
    name: Security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev clang-tools-18 python3

      # Build and test tooling only: no third-party package ships in the product.
      - name: Dependency audit (build/test tree)
        run: npm audit --audit-level=high

      #   Reject findings outside the baseline; keep the analyzer version matched to it.
      #   Reports are in build/scan-results. Public trees omit the baseline and skip this step.
      - name: Static analysis (scan-build)
        if: hashFiles('test/sec/scan-build-baseline.txt') != ''
        shell: bash
        env:
          SCAN_BUILD: scan-build-18
        run: bash bin/scan-check.sh

      - name: Upload static-analysis report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-build-report
          path: build/scan-results
          if-no-files-found: ignore
          retention-days: 90
