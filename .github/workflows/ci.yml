name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            install-deps: sudo apt-get update && sudo apt-get install -y gcc build-essential libc6-dev openssl libssl-dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies
        shell: bash
        run: ${{ matrix.install-deps }}

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH
        if: runner.os != 'Windows'

      - name: Add Bun to PATH (Windows)
        run: echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: runner.os == 'Windows'

      #
      #   Installs the @embedthis/testme and @embedthis/ejscript devDependencies from the lockfile.
      #   The TestMe post-install script builds the "tm" command into ~/.bun/bin, which is on the
      #   PATH from the steps above.
      #
      - name: Install test dependencies
        shell: bash
        run: npm ci

      - name: Verify TestMe installation (Unix)
        if: runner.os != 'Windows'
        run: |
          tm --version

      - name: Verify TestMe installation (Windows)
        if: runner.os == 'Windows'
        run: |
          tm.exe --version
          # Get-ChildItem -Recurse -Path "C:\Program Files\OpenSSL"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          make SHOW=1

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call projects\openssl-prep.bat
          msbuild projects\vs2022\goahead.sln /p:Configuration=debug /p:Platform=windows /v:normal

      - name: Run test suite (Unix)
        if: runner.os != 'Windows'
        run: |
          make test

      - name: Run test suite (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call projects\openssl-prep.bat
          tm test
