# Dependabot proposes updates to pinned action commits and Linux image digests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /test/utils
    schedule:
      interval: weekly
    # The image matches CI's ubuntu-latest runner, so only its digest moves
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
